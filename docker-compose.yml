x-app: &app
  build: .
  env_file:
    - app.env
  restart: always
  networks:
    - app
    - database
    - storage

services:
  # Django on Daphne (ASGI server: HTTP + WebSocket). Not published, only nginx can reach it
  app:
    <<: *app
    command: [ "daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application" ]
    volumes:
      - static_data:/home/user/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # Celery worker: stores uploaded files in MinIO in the background
  celery:
    <<: *app
    command: [ "celery", "-A", "config", "worker", "-l", "info" ]
    depends_on:
      - app

  # reverse proxy: the only service open to the outside
  nginx:
    image: nginx:1.27
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/home/user/app/static:ro
    networks:
      - app
    depends_on:
      - app

  db:
    image: postgres:16
    restart: always
    env_file:
      - db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      retries: 10

  # cache + Celery broker + Channels layer
  redis:
    image: redis:7
    restart: always
    networks:
      - database

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - minio.env
    ports:
      - "127.0.0.1:9001:9001" # MinIO web console
    volumes:
      - minio_data:/data
    networks:
      - storage

networks:
  app:
    name: sanaap-app
    driver: bridge
  database:
    name: sanaap-database
    driver: bridge
  storage:
    name: sanaap-storage
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  static_data:
